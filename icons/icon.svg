<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background circle  solid black -->
  <circle cx="64" cy="64" r="64" fill="#111111"/>

  <!-- Radar arcs  white, centered at 78,78 pointing bottom-right -->
  <path d="M 48 80 A 20 20 0 0 1 80 48" stroke="white" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M 40 88 A 34 34 0 0 1 88 40" stroke="white" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M 32 96 A 48 48 0 0 1 96 32" stroke="white" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.20"/>

  <!-- Radar tower base: two legs -->
  <line x1="64" y1="64" x2="48" y2="86" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="80" y2="86" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="44" y1="86" x2="84" y2="86" stroke="white" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Emission dot  bright white -->
  <circle cx="64" cy="62" r="5" fill="white"/>
</svg>
